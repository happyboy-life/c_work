<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二手图书借阅平台 - 图书详情</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            font-size: 14px;
            color: #333;
        }
        /* Toast提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        /* 自定义弹窗遮罩 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-mask.show {
            display: flex;
        }
        .modal-dialog {
            background-color: #fff;
            border-radius: 12px;
            width: 300px;
            padding: 25px 20px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-title {
            font-size: 17px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .modal-content {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .modal-content .qq-highlight {
            color: #0088ff;
            font-weight: bold;
            font-size: 18px;
        }
        .modal-btn {
            display: inline-block;
            padding: 10px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }
        .modal-btn:active {
            opacity: 0.8;
        }
        .modal-btn.cancel {
            background: #999;
            margin-right: 10px;
        }
        .modal-input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .modal-input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .modal-input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .modal-input-group input:focus {
            border-color: #667eea;
        }
        .modal-error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 2px;
            display: none;
        }

        /* ========== 图书详情页样式 ========== */
        .detail-page {
            background-color: #fff;
            padding-bottom: 10px;
        }
        .detail-header-bar {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            background-color: rgba(255,255,255,0.95);
            z-index: 90;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }
        .detail-back-btn {
            font-size: 18px;
            color: #333;
            cursor: pointer;
            display: inline-block;
        }
        .collect-btn {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .collect-btn:active {
            transform: scale(1.2);
        }
        .collect-btn.collected {
            color: #ff6600;
        }
        .detail-img-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .detail-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .detail-info-area {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .detail-book-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .detail-author {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .detail-price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
        }
        .detail-price-num {
            font-size: 24px;
            color: #ff4400;
            font-weight: bold;
        }
        .detail-stock {
            font-size: 13px;
            color: #999;
        }
        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .detail-tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 3px;
            background-color: #f0f0f0;
            color: #666;
        }
        .detail-tag.category {
            background-color: #e6f7ff;
            color: #0088ff;
        }
        .detail-tag.condition {
            background-color: #fff7e6;
            color: #ff6600;
        }
        .detail-desc-area {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .desc-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .detail-seller-area {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .seller-card {
            background-color: #f8f8f8;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
        }
        .seller-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #0088ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            font-size: 16px;
        }
        .seller-info {
            flex: 1;
        }
        .seller-name {
            font-size: 15px;
            color: #333;
            margin-bottom: 3px;
        }
        .seller-tip {
            font-size: 12px;
            color: #999;
        }
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 8px 15px;
        }
        .action-btn {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 22px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-btn:active {
            opacity: 0.8;
        }
        .btn-buy {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
    </style>
</head>
<body class="detail-page">
    <!-- 返回栏 -->
    <div class="detail-header-bar">
        <span class="detail-back-btn" id="detailBackBtn">←</span>
        <span class="collect-btn" id="collectBtn">☆</span>
    </div>

    <!-- 图书封面 -->
    <div class="detail-img-container" id="detailImgContainer">
        <img src="" alt="图书封面" id="bookCover">
    </div>

    <!-- 基本信息 -->
    <div class="detail-info-area">
        <div class="detail-book-name" id="detailBookName"></div>
        <div class="detail-author" id="detailAuthor"></div>
        <div class="detail-price-row">
            <span class="detail-price-num" id="detailPriceNum"></span>
            <span class="detail-stock" id="detailStock"></span>
        </div>
        <div class="detail-tags">
            <span class="detail-tag category" id="detailCategory"></span>
            <span class="detail-tag condition" id="detailCondition"></span>
        </div>
    </div>

    <!-- 图书简介 -->
    <div class="detail-desc-area">
        <div class="section-title">图书简介</div>
        <div class="desc-content" id="detailDescContent"></div>
    </div>

    <!-- 卖家信息 -->
    <div class="detail-seller-area">
        <div class="section-title">卖家信息</div>
        <div class="seller-card">
            <div class="seller-avatar" id="sellerAvatar">书</div>
            <div class="seller-info">
                <div class="seller-name" id="sellerName"></div>
                <div class="seller-tip">二手图书交易平台</div>
            </div>
        </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar">
        <button class="action-btn btn-buy" id="buyBtn">立即购买</button>
    </div>

    <!-- 提示弹窗 -->
    <div class="toast" id="toast"></div>

    <!-- 卖家联系方式弹窗 -->
    <div class="modal-mask" id="contactModal">
        <div class="modal-dialog">
            <div class="modal-title">🎉 购买成功</div>
            <div class="modal-content" id="modalContent">
                请联系卖家完成交易<br>
                卖家QQ：<span class="qq-highlight" id="modalQQ">--</span>
            </div>
            <button class="modal-btn" id="modalCloseBtn">知道了</button>
        </div>
    </div>

    <!-- 购买确认弹窗（第一次提醒） -->
    <div class="modal-mask" id="purchaseConfirmModal">
        <div class="modal-dialog" style="width: 320px;">
            <div class="modal-title">📖 确认购买</div>
            <div class="modal-content" id="purchaseConfirmContent" style="text-align: left;">
            </div>
            <div class="modal-input-group" id="buyerNameGroup">
                <label>买家姓名</label>
                <input type="text" id="buyerNameInput" placeholder="请输入您的姓名">
                <div class="modal-error" id="buyerNameError"></div>
            </div>
            <div class="modal-input-group" id="buyerPhoneGroup">
                <label>联系电话</label>
                <input type="text" id="buyerPhoneInput" placeholder="请输入您的联系电话">
                <div class="modal-error" id="buyerPhoneError"></div>
            </div>
            <div class="modal-input-group" id="buyerStudentIdGroup">
                <label>学号</label>
                <input type="text" id="buyerStudentIdInput" placeholder="请输入您的学号">
                <div class="modal-error" id="buyerStudentIdError"></div>
            </div>
            <div style="margin-top: 15px;">
                <button class="modal-btn cancel" id="purchaseCancelBtn">取消</button>
                <button class="modal-btn" id="purchaseConfirmBtn">确认购买</button>
            </div>
        </div>
    </div>

    <!-- 二次确认弹窗 -->
    <div class="modal-mask" id="secondConfirmModal">
        <div class="modal-dialog">
            <div class="modal-title">⚠️ 请再次确认</div>
            <div class="modal-content" id="secondConfirmContent">
                您确定要购买此书吗？<br>
                购买后请主动联系卖家完成交易。
            </div>
            <button class="modal-btn cancel" id="secondCancelBtn">再想想</button>
            <button class="modal-btn" id="secondConfirmBtn">确定购买</button>
        </div>
    </div>

    <script>
        // ========== API基础路径 ==========
        const DETAIL_API_BASE = 'http://localhost:8080';
        let currentBookCache = null;  // 缓存当前图书数据

        // ========== 从后端API获取图书详情 ==========
        async function fetchBookDetail(bookId) {
            try {
                const response = await fetch(`${DETAIL_API_BASE}/api/books/${bookId}`);
                const result = await response.json();
                if (result.code === 200 && result.data) {
                    currentBookCache = result.data;
                    return result.data;
                }
                return null;
            } catch (err) {
                console.error('[Detail] 获取图书详情失败:', err);
                return null;
            }
        }

        // ========== 从后端API搜索图书 ==========
        async function fetchBookByIdFromSearch(bookId) {
            try {
                const response = await fetch(`${DETAIL_API_BASE}/api/books/search?id=${bookId}`);
                const result = await response.json();
                if (result.code === 200 && result.data && result.data.length > 0) {
                    return result.data[0];
                }
                return null;
            } catch (err) {
                console.error('[Detail] 搜索图书失败:', err);
                return null;
            }
        }

        // ========== DOM元素缓存 ==========
        const toast = document.getElementById('toast');
        const detailBackBtn = document.getElementById('detailBackBtn');
        const collectBtn = document.getElementById('collectBtn');
        const bookCover = document.getElementById('bookCover');
        const detailBookName = document.getElementById('detailBookName');
        const detailAuthor = document.getElementById('detailAuthor');
        const detailPriceNum = document.getElementById('detailPriceNum');
        const detailStock = document.getElementById('detailStock');
        const detailCategory = document.getElementById('detailCategory');
        const detailCondition = document.getElementById('detailCondition');
        const detailDescContent = document.getElementById('detailDescContent');
        const sellerName = document.getElementById('sellerName');
        const sellerAvatar = document.getElementById('sellerAvatar');
        const buyBtn = document.getElementById('buyBtn');

        // 当前图书ID和收藏状态
        let currentBookId = null;
        let isCollected = false;

        // ========== 工具函数 ==========
        function showToast(message, duration = 2000) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        // 获取当前登录用户
        function getCurrentUser() {
            const currentUserId = localStorage.getItem('currentUserId');
            if (!currentUserId) return null;
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            return users[currentUserId] ? { id: currentUserId, ...users[currentUserId] } : null;
        }

        // 检查资料是否完善
        function isProfileComplete() {
            const user = getCurrentUser();
            return user && user.isProfileComplete === true;
        }

        // ========== 获取URL参数 ==========
        function getUrlParam(name) {
            const searchParams = new URLSearchParams(window.location.search);
            return searchParams.get(name);
        }

        // ========== 获取/设置全局库存（用localStorage持久化） ==========
        function getGlobalInventory() {
            const inv = localStorage.getItem('books_inventory');
            return inv ? JSON.parse(inv) : {};
        }

        function setGlobalInventory(inventory) {
            localStorage.setItem('books_inventory', JSON.stringify(inventory));
        }

        // 获取某本书的当前真实库存
        function getBookCurrentStock(bookId, defaultStock) {
            const inv = getGlobalInventory();
            if (inv.hasOwnProperty(bookId)) {
                return inv[bookId];
            }
            // 首次初始化
            inv[bookId] = defaultStock;
            setGlobalInventory(inv);
            return defaultStock;
        }

        // ========== 获取收藏列表 ==========
        function getCollectList() {
            const list = localStorage.getItem('collect_list');
            return list ? JSON.parse(list) : [];
        }

        // ========== 保存收藏列表 ==========
        function saveCollectList(list) {
            localStorage.setItem('collect_list', JSON.stringify(list));
        }

        // ========== 检查是否已收藏 ==========
        function checkCollectStatus(bookId) {
            const list = getCollectList();
            return list.includes(bookId);
        }

        // ========== 切换收藏状态 ==========
        function toggleCollect(bookId) {
            let list = getCollectList();
            if (list.includes(bookId)) {
                // 取消收藏
                list = list.filter(id => id !== bookId);
                saveCollectList(list);
                isCollected = false;
                collectBtn.textContent = '☆';
                collectBtn.classList.remove('collected');
                showToast('已取消收藏');
            } else {
                // 添加收藏
                list.push(bookId);
                saveCollectList(list);
                isCollected = true;
                collectBtn.textContent = '★';
                collectBtn.classList.add('collected');
                showToast('收藏成功');
            }
        }

        // ========== 更新购买按钮状态 ==========
        function updateBuyButton(book) {
            if (book.stock <= 0) {
                buyBtn.textContent = '暂时缺货';
                buyBtn.style.backgroundColor = '#ccc';
                buyBtn.style.cursor = 'not-allowed';
                buyBtn.disabled = true;
            } else {
                buyBtn.textContent = '立即购买';
                buyBtn.style.backgroundColor = '';
                buyBtn.style.cursor = '';
                buyBtn.disabled = false;
            }
        }

        // ========== 渲染详情页数据（从后端API获取） ==========
        async function renderDetailPage() {
            const bookId = getUrlParam('id');
            if (!bookId) {
                showToast('图书ID不存在');
                setTimeout(() => { window.location.href = 'goods.html'; }, 1500);
                return;
            }

            currentBookId = parseInt(bookId);

            // 优先从后端API获取图书详情
            let book = await fetchBookDetail(currentBookId);
            if (!book) {
                // 降级：使用搜索接口
                book = await fetchBookByIdFromSearch(currentBookId);
            }

            if (!book) {
                showToast('图书不存在或后端服务未启动');
                setTimeout(() => { window.location.href = 'goods.html'; }, 2000);
                return;
            }

            // 从localStorage同步真实库存（本地补充）
            const localStock = getBookCurrentStock(currentBookId, book.stock);
            if (localStock !== book.stock) {
                book.stock = localStock;
            }

            // 填充基本信息
            bookCover.src = book.image_url || book.images?.[0] || 'https://picsum.photos/400/560?random=' + book.id;
            bookCover.alt = book.name;
            detailBookName.textContent = book.name;
            detailAuthor.textContent = `作者：${book.author || '未知'}`;
            detailPriceNum.textContent = `¥${parseFloat(book.price).toFixed(2)}`;
            detailStock.textContent = `剩余 ${book.stock} 本`;
            detailCategory.textContent = book.category || '未分类';
            detailCondition.textContent = book.condition || '未标注';
            detailDescContent.textContent = book.description || '暂无简介';
            sellerName.textContent = book.seller_name || '匿名用户';
            sellerAvatar.textContent = (book.seller_name || '书').charAt(0);

            // 更新购买按钮状态
            updateBuyButton(book);

            // 检查收藏状态
            isCollected = checkCollectStatus(currentBookId);
            if (isCollected) {
                collectBtn.textContent = '★';
                collectBtn.classList.add('collected');
            } else {
                collectBtn.textContent = '☆';
                collectBtn.classList.remove('collected');
            }
        }

        // ========== 事件绑定 ==========
        // 返回按钮
        detailBackBtn.addEventListener('click', () => {
            window.location.href = 'goods.html';
        });

        // 收藏按钮
        collectBtn.addEventListener('click', () => {
            if (!currentBookId) return;
            toggleCollect(currentBookId);
        });

        // 购买按钮
        buyBtn.addEventListener('click', async () => {
            // 检查资料是否完善
            if (!isProfileComplete()) {
                showToast('请先完善个人资料');
                setTimeout(() => {
                    window.location.href = 'mydata.html';
                }, 1500);
                return;
            }

            // 使用缓存的图书数据
            const book = currentBookCache;
            if (!book) {
                showToast('图书信息异常');
                return;
            }
            // 重新同步库存
            book.stock = getBookCurrentStock(currentBookId, book.stock);

            if (book.stock <= 0) {
                showToast('该图书暂时缺货');
                updateBuyButton(book);
                return;
            }

            // --- 弹出购买确认弹窗（第一次提醒） ---
            showPurchaseConfirmModal(book);
        });

        // ========== 获取卖家QQ ==========
        function getSellerQQ(book) {
            // 如果图书有userId，从该用户的profile获取QQ
            if (book.userId) {
                const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
                const sellerProfile = profiles[book.userId];
                if (sellerProfile && sellerProfile.qq) {
                    return sellerProfile.qq;
                }
            }
            // 否则从users中按姓名匹配
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
            for (const uid in users) {
                const profile = profiles[uid];
                if (profile && profile.name === book.seller_name && profile.qq) {
                    return profile.qq;
                }
            }
            return '暂未填写';
        }

        // ========== 弹窗关闭 ==========
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            document.getElementById('contactModal').classList.remove('show');
        });

        // 点击遮罩也关闭
        document.getElementById('contactModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('contactModal')) {
                document.getElementById('contactModal').classList.remove('show');
            }
        });

        // ========== 购买确认弹窗逻辑 ==========
        let pendingPurchaseBook = null;

        function showPurchaseConfirmModal(book) {
            pendingPurchaseBook = book;
            // 填充图书信息
            const content = document.getElementById('purchaseConfirmContent');
            content.innerHTML = `
                <p><strong>书名：</strong>${book.name}</p>
                <p><strong>作者：</strong>${book.author}</p>
                <p><strong>价格：</strong><span style="color:#ff4400;font-weight:bold;">¥${book.price.toFixed(2)}</span></p>
                <p style="margin-top: 8px; color: #e67e22; font-size: 13px;">⚠ 请确认以上信息无误后，填写您的联系方式</p>
            `;

            // 预填充（如果已登录）
            const user = getCurrentUser();
            const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
            const profile = user ? profiles[user.id] : null;
            if (profile) {
                document.getElementById('buyerNameInput').value = profile.name || '';
                document.getElementById('buyerStudentIdInput').value = profile.studentId || '';
            }
            document.getElementById('buyerPhoneInput').value = '';
            hideAllErrors();

            document.getElementById('purchaseConfirmModal').classList.add('show');
        }

        function hideAllErrors() {
            ['buyerNameError', 'buyerPhoneError', 'buyerStudentIdError'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
        }

        // 取消购买
        document.getElementById('purchaseCancelBtn').addEventListener('click', () => {
            document.getElementById('purchaseConfirmModal').classList.remove('show');
            pendingPurchaseBook = null;
        });

        document.getElementById('purchaseConfirmModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('purchaseConfirmModal')) {
                document.getElementById('purchaseConfirmModal').classList.remove('show');
                pendingPurchaseBook = null;
            }
        });

        // 第一次确认 → 弹出二次确认
        document.getElementById('purchaseConfirmBtn').addEventListener('click', () => {
            // 验证输入
            hideAllErrors();
            let hasError = false;
            const buyerName = document.getElementById('buyerNameInput').value.trim();
            const buyerPhone = document.getElementById('buyerPhoneInput').value.trim();
            const buyerStudentId = document.getElementById('buyerStudentIdInput').value.trim();

            if (!buyerName) {
                document.getElementById('buyerNameError').textContent = '请输入姓名';
                document.getElementById('buyerNameError').style.display = 'block';
                hasError = true;
            }
            if (!buyerPhone) {
                document.getElementById('buyerPhoneError').textContent = '请输入联系电话';
                document.getElementById('buyerPhoneError').style.display = 'block';
                hasError = true;
            }
            if (!buyerStudentId) {
                document.getElementById('buyerStudentIdError').textContent = '请输入学号';
                document.getElementById('buyerStudentIdError').style.display = 'block';
                hasError = true;
            }
            if (hasError) return;

            // 隐藏第一次确认弹窗，显示二次确认
            document.getElementById('purchaseConfirmModal').classList.remove('show');
            // 更新二次确认内容
            const book = pendingPurchaseBook;
            document.getElementById('secondConfirmContent').innerHTML = `
                <p>您确定要购买《<strong>${book.name}</strong>》吗？</p>
                <p style="margin-top: 8px;">价格：<strong style="color:#ff4400;">¥${book.price.toFixed(2)}</strong></p>
                <p style="margin-top: 8px; font-size: 13px; color: #e67e22;">
                    ⚠ 购买后请主动联系卖家完成线下交易<br>
                    请确认信息无误
                </p>
            `;
            document.getElementById('secondConfirmModal').classList.add('show');
        });

        // 二次确认取消
        document.getElementById('secondCancelBtn').addEventListener('click', () => {
            document.getElementById('secondConfirmModal').classList.remove('show');
            // 回到第一次确认弹窗
            document.getElementById('purchaseConfirmModal').classList.add('show');
        });

        document.getElementById('secondConfirmModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('secondConfirmModal')) {
                document.getElementById('secondConfirmModal').classList.remove('show');
                document.getElementById('purchaseConfirmModal').classList.add('show');
            }
        });

        // 二次确认通过 → 执行购买
        document.getElementById('secondConfirmBtn').addEventListener('click', async () => {
            document.getElementById('secondConfirmModal').classList.remove('show');
            const book = pendingPurchaseBook;
            if (!book) return;

            const buyerName = document.getElementById('buyerNameInput').value.trim();
            const buyerPhone = document.getElementById('buyerPhoneInput').value.trim();
            const buyerStudentId = document.getElementById('buyerStudentIdInput').value.trim();
            const purchaseTime = new Date().toLocaleString('zh-CN');

            // --- 执行购买 ---

            // 1. 尝试调用后端API扣减库存
            let backendOk = false;
            try {
                const user = getCurrentUser();
                if (user) {
                    const response = await fetch('http://localhost:8080/api/purchase', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: parseInt(user.id), bookId: book.id })
                    });
                    const result = await response.json();
                    if (result.code === 200) {
                        backendOk = true;
                    } else {
                        // 后端返回错误（如未找到图书）时降级到本地模式
                        console.log('后端返回错误，降级到本地模式:', result.message);
                    }
                }
            } catch (e) {
                // 后端不可用时，使用本地localStorage模式
                console.log('后端未连接，使用本地模式:', e.message);
            }

            // 2. 更新全局库存（localStorage）
            book.stock--;
            const inv = getGlobalInventory();
            inv[currentBookId] = book.stock;
            setGlobalInventory(inv);

            // 3. 更新页面显示
            detailStock.textContent = `剩余 ${book.stock} 本`;
            updateBuyButton(book);

            // 4. 记录购买信息（含买家信息和购买时间）
            let purchasedBooks = JSON.parse(localStorage.getItem('purchased_books') || '[]');
            const alreadyPurchased = purchasedBooks.find(b => b.id === book.id);
            if (!alreadyPurchased) {
                const purchasedEntry = Object.assign({}, book, {
                    buyerName: buyerName,
                    buyerPhone: buyerPhone,
                    buyerStudentId: buyerStudentId,
                    purchaseTime: purchaseTime
                });
                purchasedBooks.push(purchasedEntry);
                localStorage.setItem('purchased_books', JSON.stringify(purchasedBooks));
            }

            // 5. 保存购买记录到专门的购买日志
            let purchaseLog = JSON.parse(localStorage.getItem('purchase_log') || '[]');
            purchaseLog.push({
                bookId: book.id,
                bookName: book.name,
                price: book.price,
                sellerName: book.seller_name,
                buyerName: buyerName,
                buyerPhone: buyerPhone,
                buyerStudentId: buyerStudentId,
                purchaseTime: purchaseTime
            });
            localStorage.setItem('purchase_log', JSON.stringify(purchaseLog));

            // 6. 弹出卖家联系方式弹窗
            const sellerQQ = getSellerQQ(book);
            document.getElementById('modalQQ').textContent = sellerQQ;
            document.getElementById('contactModal').classList.add('show');

            pendingPurchaseBook = null;
        });

        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderDetailPage();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二手图书借阅平台 - 图书详情</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            font-size: 14px;
            color: #333;
        }
        /* Toast提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        /* 自定义弹窗遮罩 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-mask.show {
            display: flex;
        }
        .modal-dialog {
            background-color: #fff;
            border-radius: 12px;
            width: 300px;
            padding: 25px 20px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-title {
            font-size: 17px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .modal-content {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .modal-content .qq-highlight {
            color: #0088ff;
            font-weight: bold;
            font-size: 18px;
        }
        .modal-btn {
            display: inline-block;
            padding: 10px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }
        .modal-btn:active {
            opacity: 0.8;
        }

        /* ========== 图书详情页样式 ========== */
        .detail-page {
            background-color: #fff;
            padding-bottom: 10px;
        }
        .detail-header-bar {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            background-color: rgba(255,255,255,0.95);
            z-index: 90;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }
        .detail-back-btn {
            font-size: 18px;
            color: #333;
            cursor: pointer;
            display: inline-block;
        }
        .collect-btn {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .collect-btn:active {
            transform: scale(1.2);
        }
        .collect-btn.collected {
            color: #ff6600;
        }
        .detail-img-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .detail-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .detail-info-area {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .detail-book-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .detail-author {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .detail-price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
        }
        .detail-price-num {
            font-size: 24px;
            color: #ff4400;
            font-weight: bold;
        }
        .detail-stock {
            font-size: 13px;
            color: #999;
        }
        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .detail-tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 3px;
            background-color: #f0f0f0;
            color: #666;
        }
        .detail-tag.category {
            background-color: #e6f7ff;
            color: #0088ff;
        }
        .detail-tag.condition {
            background-color: #fff7e6;
            color: #ff6600;
        }
        .detail-desc-area {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .desc-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .detail-seller-area {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
        }
        .seller-card {
            background-color: #f8f8f8;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
        }
        .seller-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #0088ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            font-size: 16px;
        }
        .seller-info {
            flex: 1;
        }
        .seller-name {
            font-size: 15px;
            color: #333;
            margin-bottom: 3px;
        }
        .seller-tip {
            font-size: 12px;
            color: #999;
        }
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 8px 15px;
        }
        .action-btn {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 22px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-btn:active {
            opacity: 0.8;
        }
        .btn-buy {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
    </style>
</head>
<body class="detail-page">
    <!-- 返回栏 -->
    <div class="detail-header-bar">
        <span class="detail-back-btn" id="detailBackBtn">←</span>
        <span class="collect-btn" id="collectBtn">☆</span>
    </div>

    <!-- 图书封面 -->
    <div class="detail-img-container" id="detailImgContainer">
        <img src="" alt="图书封面" id="bookCover">
    </div>

    <!-- 基本信息 -->
    <div class="detail-info-area">
        <div class="detail-book-name" id="detailBookName"></div>
        <div class="detail-author" id="detailAuthor"></div>
        <div class="detail-price-row">
            <span class="detail-price-num" id="detailPriceNum"></span>
            <span class="detail-stock" id="detailStock"></span>
        </div>
        <div class="detail-tags">
            <span class="detail-tag category" id="detailCategory"></span>
            <span class="detail-tag condition" id="detailCondition"></span>
        </div>
    </div>

    <!-- 图书简介 -->
    <div class="detail-desc-area">
        <div class="section-title">图书简介</div>
        <div class="desc-content" id="detailDescContent"></div>
    </div>

    <!-- 卖家信息 -->
    <div class="detail-seller-area">
        <div class="section-title">卖家信息</div>
        <div class="seller-card">
            <div class="seller-avatar" id="sellerAvatar">书</div>
            <div class="seller-info">
                <div class="seller-name" id="sellerName"></div>
                <div class="seller-tip">二手图书交易平台</div>
            </div>
        </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar">
        <button class="action-btn btn-buy" id="buyBtn">立即购买</button>
    </div>

    <!-- 提示弹窗 -->
    <div class="toast" id="toast"></div>

    <!-- 卖家联系方式弹窗 -->
    <div class="modal-mask" id="contactModal">
        <div class="modal-dialog">
            <div class="modal-title">🎉 购买成功</div>
            <div class="modal-content" id="modalContent">
                请联系卖家完成交易<br>
                卖家QQ：<span class="qq-highlight" id="modalQQ">--</span>
            </div>
            <button class="modal-btn" id="modalCloseBtn">知道了</button>
        </div>
    </div>

    <script>
        // ========== 模拟图书数据（初始数据，库存会被localStorage覆盖） ==========
        const mockBooksList = [
            {
                id: 1,
                name: '百年孤独',
                author: '加西亚·马尔克斯',
                category: '文学小说',
                condition: '八成新',
                price: 25.00,
                stock: 3,
                description: '魔幻现实主义文学代表作，讲述布恩迪亚家族七代人的传奇故事。这本书以马孔多小镇为背景，通过布恩迪亚家族的兴衰史，展现了拉丁美洲一个世纪的历史变迁。书中融合了现实与幻想，创造出一个充满奇迹的世界。',
                seller_name: '书虫小李',
                images: ['https://picsum.photos/400/560?random=1']
            },
            {
                id: 2,
                name: 'JavaScript高级程序设计（第4版）',
                author: '马特·弗里斯比',
                category: '科学技术',
                condition: '九成新',
                price: 55.00,
                stock: 2,
                description: '前端开发必备经典书籍，全面讲解JavaScript语言核心特性。本书从基础语法到高级应用，深入浅出地介绍了ES6+新特性、异步编程、DOM操作等内容，是前端开发者不可多得的学习资料。',
                seller_name: '程序员小王',
                images: ['https://picsum.photos/400/560?random=2']
            },
            {
                id: 3,
                name: '人类简史',
                author: '尤瓦尔·赫拉利',
                category: '人文社科',
                condition: '七成新',
                price: 30.00,
                stock: 1,
                description: '从认知革命到科学革命，梳理人类历史发展脉络。作者以独特的视角审视人类历史，探讨了农业革命、科学革命等重大历史事件对人类社会的深远影响。',
                seller_name: '历史爱好者',
                images: ['https://picsum.photos/400/560?random=3']
            },
            {
                id: 4,
                name: '经济学原理',
                author: '曼昆',
                category: '经济管理',
                condition: '八五成新',
                price: 45.00,
                stock: 5,
                description: '经济学入门经典教材，通俗易懂地讲解微观和宏观经济学原理。本书通过大量实例帮助读者理解经济学的思维方式，适合初学者系统学习经济学知识。',
                seller_name: '经济学霸',
                images: ['https://picsum.photos/400/560?random=4']
            },
            {
                id: 5,
                name: '高等数学（第七版）上册',
                author: '同济大学数学系',
                category: '教育考试',
                condition: '六成新',
                price: 15.00,
                stock: 2,
                description: '大学高数经典教材，适合考研复习使用。内容涵盖极限、导数、积分等核心知识点，配有丰富的习题和解答。',
                seller_name: '考研党',
                images: ['https://picsum.photos/400/560?random=5']
            },
            {
                id: 6,
                name: '活着',
                author: '余华',
                category: '文学小说',
                condition: '九成新',
                price: 18.00,
                stock: 4,
                description: '讲述一个人一生的故事，展现生命的坚韧与力量。主人公福贵经历了中国近现代史上的重大事件，在苦难中依然保持着对生活的热爱。',
                seller_name: '文艺青年',
                images: ['https://picsum.photos/400/560?random=6']
            }
        ];

        // ========== DOM元素缓存 ==========
        const toast = document.getElementById('toast');
        const detailBackBtn = document.getElementById('detailBackBtn');
        const collectBtn = document.getElementById('collectBtn');
        const bookCover = document.getElementById('bookCover');
        const detailBookName = document.getElementById('detailBookName');
        const detailAuthor = document.getElementById('detailAuthor');
        const detailPriceNum = document.getElementById('detailPriceNum');
        const detailStock = document.getElementById('detailStock');
        const detailCategory = document.getElementById('detailCategory');
        const detailCondition = document.getElementById('detailCondition');
        const detailDescContent = document.getElementById('detailDescContent');
        const sellerName = document.getElementById('sellerName');
        const sellerAvatar = document.getElementById('sellerAvatar');
        const buyBtn = document.getElementById('buyBtn');

        // 当前图书ID和收藏状态
        let currentBookId = null;
        let isCollected = false;

        // ========== 工具函数 ==========
        function showToast(message, duration = 2000) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        // 获取当前登录用户
        function getCurrentUser() {
            const currentUserId = localStorage.getItem('currentUserId');
            if (!currentUserId) return null;
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            return users[currentUserId] ? { id: currentUserId, ...users[currentUserId] } : null;
        }

        // 检查资料是否完善
        function isProfileComplete() {
            const user = getCurrentUser();
            return user && user.isProfileComplete === true;
        }

        // ========== 获取URL参数 ==========
        function getUrlParam(name) {
            const searchParams = new URLSearchParams(window.location.search);
            return searchParams.get(name);
        }

        // ========== 获取/设置全局库存（用localStorage持久化） ==========
        function getGlobalInventory() {
            const inv = localStorage.getItem('books_inventory');
            return inv ? JSON.parse(inv) : {};
        }

        function setGlobalInventory(inventory) {
            localStorage.setItem('books_inventory', JSON.stringify(inventory));
        }

        // 获取某本书的当前真实库存
        function getBookCurrentStock(bookId, defaultStock) {
            const inv = getGlobalInventory();
            if (inv.hasOwnProperty(bookId)) {
                return inv[bookId];
            }
            // 首次初始化
            inv[bookId] = defaultStock;
            setGlobalInventory(inv);
            return defaultStock;
        }

        // ========== 获取收藏列表 ==========
        function getCollectList() {
            const list = localStorage.getItem('collect_list');
            return list ? JSON.parse(list) : [];
        }

        // ========== 保存收藏列表 ==========
        function saveCollectList(list) {
            localStorage.setItem('collect_list', JSON.stringify(list));
        }

        // ========== 检查是否已收藏 ==========
        function checkCollectStatus(bookId) {
            const list = getCollectList();
            return list.includes(bookId);
        }

        // ========== 切换收藏状态 ==========
        function toggleCollect(bookId) {
            let list = getCollectList();
            if (list.includes(bookId)) {
                // 取消收藏
                list = list.filter(id => id !== bookId);
                saveCollectList(list);
                isCollected = false;
                collectBtn.textContent = '☆';
                collectBtn.classList.remove('collected');
                showToast('已取消收藏');
            } else {
                // 添加收藏
                list.push(bookId);
                saveCollectList(list);
                isCollected = true;
                collectBtn.textContent = '★';
                collectBtn.classList.add('collected');
                showToast('收藏成功');
            }
        }

        // ========== 更新购买按钮状态 ==========
        function updateBuyButton(book) {
            if (book.stock <= 0) {
                buyBtn.textContent = '暂时缺货';
                buyBtn.style.backgroundColor = '#ccc';
                buyBtn.style.cursor = 'not-allowed';
                buyBtn.disabled = true;
            } else {
                buyBtn.textContent = '立即购买';
                buyBtn.style.backgroundColor = '';
                buyBtn.style.cursor = '';
                buyBtn.disabled = false;
            }
        }

        // ========== 渲染详情页数据 ==========
        function renderDetailPage() {
            const bookId = getUrlParam('id');
            if (!bookId) {
                showToast('图书ID不存在');
                setTimeout(() => {
                    window.location.href = 'goods.html';
                }, 1500);
                return;
            }

            currentBookId = parseInt(bookId);

            // 查找对应图书
            const book = mockBooksList.find(item => item.id === currentBookId);
            if (!book) {
                showToast('图书不存在');
                setTimeout(() => {
                    window.location.href = 'goods.html';
                }, 1500);
                return;
            }

            // 从localStorage同步真实库存
            book.stock = getBookCurrentStock(currentBookId, book.stock);

            // 填充基本信息
            bookCover.src = book.images[0];
            bookCover.alt = book.name;
            detailBookName.textContent = book.name;
            detailAuthor.textContent = `作者：${book.author}`;
            detailPriceNum.textContent = `¥${book.price.toFixed(2)}`;
            detailStock.textContent = `剩余 ${book.stock} 本`;
            detailCategory.textContent = book.category;
            detailCondition.textContent = book.condition;
            detailDescContent.textContent = book.description;
            sellerName.textContent = book.seller_name;
            sellerAvatar.textContent = book.seller_name.charAt(0);

            // 更新购买按钮状态
            updateBuyButton(book);

            // 检查收藏状态
            isCollected = checkCollectStatus(currentBookId);
            if (isCollected) {
                collectBtn.textContent = '★';
                collectBtn.classList.add('collected');
            } else {
                collectBtn.textContent = '☆';
                collectBtn.classList.remove('collected');
            }
        }

        // ========== 事件绑定 ==========
        // 返回按钮
        detailBackBtn.addEventListener('click', () => {
            window.location.href = 'goods.html';
        });

        // 收藏按钮
        collectBtn.addEventListener('click', () => {
            if (!currentBookId) return;
            toggleCollect(currentBookId);
        });

        // 购买按钮
        buyBtn.addEventListener('click', async () => {
            // 检查资料是否完善
            if (!isProfileComplete()) {
                showToast('请先完善个人资料');
                setTimeout(() => {
                    window.location.href = 'mydata.html';
                }, 1500);
                return;
            }

            // 查找图书并获取最新库存
            const book = mockBooksList.find(item => item.id === currentBookId);
            if (!book) {
                showToast('图书信息异常');
                return;
            }
            // 重新同步库存
            book.stock = getBookCurrentStock(currentBookId, book.stock);

            if (book.stock <= 0) {
                showToast('该图书暂时缺货');
                updateBuyButton(book);
                return;
            }

            if (!confirm(`确认购买《${book.name}》？\n价格：¥${book.price.toFixed(2)}`)) {
                return;
            }

            // --- 执行购买 ---

            // 1. 尝试调用后端API扣减库存
            try {
                const user = getCurrentUser();
                if (user) {
                    const response = await fetch('http://localhost:8080/api/purchase', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: parseInt(user.id), bookId: book.id })
                    });
                    const result = await response.json();
                    if (result.code !== 200) {
                        showToast(result.message || '购买失败');
                        return;
                    }
                }
            } catch (e) {
                // 后端不可用时，使用本地localStorage模式
                console.log('后端未连接，使用本地模式:', e.message);
            }

            // 2. 更新全局库存（localStorage）
            book.stock--;
            const inv = getGlobalInventory();
            inv[currentBookId] = book.stock;
            setGlobalInventory(inv);

            // 3. 更新页面显示
            detailStock.textContent = `剩余 ${book.stock} 本`;
            updateBuyButton(book);

            // 4. 记录购买（去重）
            let purchasedBooks = JSON.parse(localStorage.getItem('purchased_books') || '[]');
            const alreadyPurchased = purchasedBooks.find(b => b.id === book.id);
            if (!alreadyPurchased) {
                // 存储时带上当前库存快照
                const purchasedEntry = Object.assign({}, book);
                purchasedBooks.push(purchasedEntry);
                localStorage.setItem('purchased_books', JSON.stringify(purchasedBooks));
            }

            // 5. 弹出卖家联系方式弹窗
            const sellerQQ = getSellerQQ(book);
            document.getElementById('modalQQ').textContent = sellerQQ;
            document.getElementById('contactModal').classList.add('show');
        });

        // ========== 获取卖家QQ ==========
        function getSellerQQ(book) {
            // 如果图书有userId，从该用户的profile获取QQ
            if (book.userId) {
                const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
                const sellerProfile = profiles[book.userId];
                if (sellerProfile && sellerProfile.qq) {
                    return sellerProfile.qq;
                }
            }
            // 否则从users中按姓名匹配
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
            for (const uid in users) {
                const profile = profiles[uid];
                if (profile && profile.name === book.seller_name && profile.qq) {
                    return profile.qq;
                }
            }
            return '暂未填写';
        }

        // ========== 弹窗关闭 ==========
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            document.getElementById('contactModal').classList.remove('show');
        });

        // 点击遮罩也关闭
        document.getElementById('contactModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('contactModal')) {
                document.getElementById('contactModal').classList.remove('show');
            }
        });

        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderDetailPage();
        });
    </script>
</body>
</html>

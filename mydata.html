<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二手图书借阅平台 - 个人资料</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            font-size: 14px;
            color: #333;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        .page-header {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 90;
        }
        .back-btn {
            font-size: 18px;
            color: #333;
            cursor: pointer;
            margin-right: 15px;
        }
        .page-title {
            font-size: 17px;
            font-weight: bold;
            color: #333;
        }
        .save-btn {
            margin-left: auto;
            font-size: 15px;
            color: #667eea;
            cursor: pointer;
            padding: 5px 10px;
        }

        .profile-content {
            padding: 15px;
        }

        /* 头像区域 */
        .avatar-section {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #fff;
            overflow: hidden;
            cursor: pointer;
        }
        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-edit-tip {
            font-size: 12px;
            color: #999;
        }
        #avatarFileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* 表单区域 */
        .form-section {
            background-color: #fff;
            border-radius: 12px;
            padding: 0 15px;
            margin-bottom: 15px;
        }
        .form-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .form-item:last-child {
            border-bottom: none;
        }
        .form-label {
            font-size: 15px;
            color: #333;
            min-width: 80px;
            flex-shrink: 0;
        }
        .form-label.required::after {
            content: '*';
            color: #ff4444;
            margin-left: 3px;
        }
        .form-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            color: #333;
            text-align: right;
            background: transparent;
        }
        .form-input::placeholder {
            color: #ccc;
        }
        .form-input:disabled {
            color: #999;
        }
        .form-arrow {
            color: #ccc;
            margin-left: 8px;
        }

        /* 提示信息 */
        .tip-section {
            background-color: #fff9e6;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .tip-title {
            font-size: 14px;
            color: #ff6600;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .tip-content {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        /* 学号显示（不可修改） */
        .student-id-display {
            font-size: 15px;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <span class="back-btn" id="backBtn">←</span>
        <span class="page-title">个人资料</span>
        <span class="save-btn" id="saveBtn">保存</span>
    </div>

    <div class="profile-content">
        <!-- 头像区域 -->
        <div class="avatar-section">
            <div class="avatar-wrapper" id="avatarWrapper">
                <div class="avatar-img" id="avatarImg">
                    <span id="avatarText">头</span>
                </div>
                <input type="file" id="avatarFileInput" accept="image/*">
            </div>
            <div class="avatar-edit-tip">点击头像更换</div>
        </div>

        <!-- 提示信息 -->
        <div class="tip-section">
            <div class="tip-title">温馨提示</div>
            <div class="tip-content">
                完善个人资料后，您可以发布图书和购买图书。<br>
                带 * 号为必填项。学号不可修改。
            </div>
        </div>

        <!-- 表单区域 -->
        <div class="form-section">
            <div class="form-item">
                <span class="form-label">学号</span>
                <span class="student-id-display" id="studentIdDisplay">--</span>
            </div>
            <div class="form-item">
                <span class="form-label required">姓名</span>
                <input type="text" class="form-input" id="nameInput" placeholder="请输入姓名">
                <span class="form-arrow">></span>
            </div>
            <div class="form-item">
                <span class="form-label required">班级</span>
                <input type="text" class="form-input" id="classInput" placeholder="例如：计算机2101班">
                <span class="form-arrow">></span>
            </div>
            <div class="form-item">
                <span class="form-label required">QQ号</span>
                <input type="text" class="form-input" id="qqInput" placeholder="请输入QQ号码">
                <span class="form-arrow">></span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== DOM元素 ==========
        const toast = document.getElementById('toast');
        const backBtn = document.getElementById('backBtn');
        const saveBtn = document.getElementById('saveBtn');
        const avatarWrapper = document.getElementById('avatarWrapper');
        const avatarImg = document.getElementById('avatarImg');
        const avatarText = document.getElementById('avatarText');
        const avatarFileInput = document.getElementById('avatarFileInput');
        const studentIdDisplay = document.getElementById('studentIdDisplay');
        const nameInput = document.getElementById('nameInput');
        const classInput = document.getElementById('classInput');
        const qqInput = document.getElementById('qqInput');

        // ========== 工具函数 ==========
        function showToast(message, duration = 2000) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        // ========== 获取当前用户 ==========
        function getCurrentUser() {
            const currentUserId = localStorage.getItem('currentUserId');
            if (!currentUserId) return null;
            
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            return users[currentUserId] ? { id: currentUserId, ...users[currentUserId] } : null;
        }

        // ========== 获取用户资料 ==========
        function getUserProfile() {
            const user = getCurrentUser();
            if (!user) return null;
            
            const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
            return profiles[user.id] || null;
        }

        // ========== 保存用户资料 ==========
        function saveUserProfile(profile) {
            const user = getCurrentUser();
            if (!user) {
                showToast('请先登录');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
                return false;
            }

            const profiles = JSON.parse(localStorage.getItem('profiles') || '{}');
            profiles[user.id] = profile;
            localStorage.setItem('profiles', JSON.stringify(profiles));

            // 更新用户状态为已完善
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user.id]) {
                users[user.id].isProfileComplete = true;
                localStorage.setItem('users', JSON.stringify(users));
            }

            return true;
        }

        // ========== 渲染页面数据 ==========
        function renderProfile() {
            const user = getCurrentUser();
            if (!user) {
                showToast('请先登录');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
                return;
            }

            // 显示学号（不可修改）
            studentIdDisplay.textContent = user.studentId;

            // 加载已有资料
            const profile = getUserProfile();
            if (profile) {
                nameInput.value = profile.name || '';
                classInput.value = profile.className || '';
                qqInput.value = profile.qq || '';
                
                if (profile.avatar) {
                    avatarImg.innerHTML = `<img src="${profile.avatar}" alt="头像">`;
                } else if (profile.name) {
                    avatarText.textContent = profile.name.charAt(0);
                }
            }
        }

        // ========== 头像上传逻辑 ==========
        avatarWrapper.addEventListener('click', () => {
            avatarFileInput.click();
        });

        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                avatarImg.innerHTML = `<img src="${event.target.result}" alt="头像">`;
                showToast('头像已更新，请点击保存');
            };
            reader.readAsDataURL(file);
        });

        // ========== 返回按钮 ==========
        backBtn.addEventListener('click', () => {
            window.location.href = 'mine.html';
        });

        // ========== 保存按钮 ==========
        saveBtn.addEventListener('click', () => {
            // 验证必填项
            if (!nameInput.value.trim()) {
                showToast('请输入姓名');
                return;
            }
            if (!classInput.value.trim()) {
                showToast('请输入班级');
                return;
            }
            if (!qqInput.value.trim()) {
                showToast('请输入QQ号码');
                return;
            }

            const user = getCurrentUser();
            if (!user) {
                showToast('请先登录');
                return;
            }

            // 保存资料
            const profile = {
                studentId: user.studentId,
                name: nameInput.value.trim(),
                className: classInput.value.trim(),
                qq: qqInput.value.trim(),
                avatar: avatarImg.querySelector('img')?.src || null
            };
            
            if (saveUserProfile(profile)) {
                showToast('保存成功');
                setTimeout(() => {
                    window.location.href = 'mine.html';
                }, 1000);
            }
        });

        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderProfile();
        });
    </script>
</body>
</html>

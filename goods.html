<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手书交易 - 图书查询</title>
    <style>
        /* ========== 自定义可选择样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f5f5f5; color: #333; }
        /* ========== 顶部搜索栏 ========== */
        .header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; padding: 10px 12px; background-color: #fff; border-bottom: 1px solid #e5e5e5; gap: 8px; }
        .user-avatar-btn { width: 36px; height: 36px; border-radius: 50%; background-color: #0088ff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #fff; font-size: 14px; font-weight: bold; }
        .search-icon-wrap { cursor: pointer; flex-shrink: 0; padding: 4px; }
        .search-icon { width: 24px; height: 24px; }
        .search-input { flex: 1; height: 36px; border: 1px solid #ddd; border-radius: 18px; padding: 0 15px; font-size: 14px; outline: none; background-color: #f8f8f8; min-width: 0; }
        .search-input:focus { border-color: #0088ff; background-color: #fff; }
        .filter-btn { width: 36px; height: 36px; border-radius: 50%; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 18px; border: none; }
        .filter-btn.active { background-color: #e6f0ff; color: #0088ff; }

        /* ========== 高级筛选面板 ========== */
        .filter-panel { display: none; padding: 10px 12px; background-color: #fff; border-bottom: 1px solid #e5e5e5; gap: 8px; flex-wrap: wrap; }
        .filter-panel.show { display: flex; }
        .filter-row { display: flex; width: 100%; gap: 8px; align-items: center; flex-wrap: wrap; }
        .filter-label { font-size: 13px; color: #666; white-space: nowrap; }
        .filter-price-input { width: 80px; height: 30px; border: 1px solid #ddd; border-radius: 4px; padding: 0 8px; font-size: 13px; outline: none; }
        .filter-price-input:focus { border-color: #0088ff; }
        .filter-select { height: 30px; border: 1px solid #ddd; border-radius: 4px; padding: 0 8px; font-size: 13px; outline: none; background: #fff; }
        .filter-select:focus { border-color: #0088ff; }
        .filter-input { flex: 1; height: 30px; border: 1px solid #ddd; border-radius: 4px; padding: 0 8px; font-size: 13px; outline: none; min-width: 100px; }
        .filter-input:focus { border-color: #0088ff; }
        .filter-actions { display: flex; gap: 8px; margin-left: auto; }
        .btn-reset { height: 30px; padding: 0 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; font-size: 13px; cursor: pointer; color: #666; }
        .btn-apply { height: 30px; padding: 0 12px; border: none; border-radius: 4px; background: #0088ff; color: #fff; font-size: 13px; cursor: pointer; }

        /* ========== 搜索历史 ========== */
        .search-history { display: none; padding: 10px 12px; background-color: #fff; border-bottom: 1px solid #e5e5e5; }
        .search-history.show { display: block; }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .history-title { font-size: 13px; color: #999; }
        .clear-history { font-size: 13px; color: #0088ff; cursor: pointer; }
        .history-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .history-item { font-size: 12px; color: #666; background-color: #f0f0f0; padding: 4px 10px; border-radius: 12px; cursor: pointer; }
        .history-item:hover { background-color: #ddeeff; color: #0088ff; }

        /* ========== 分类筛选栏 ========== */
        .category { display: flex; padding: 10px 12px; background-color: #fff; border-bottom: 1px solid #eee; gap: 8px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .category::-webkit-scrollbar { display: none; }
        .category .item { flex-shrink: 0; padding: 6px 14px; border-radius: 16px; font-size: 13px; background-color: #f5f5f5; color: #666; cursor: pointer; transition: all 0.2s; }
        .category .item.active { background-color: #0088ff; color: #fff; font-weight: bold; }

        /* ========== 图书列表 ========== */
        .goods-list { padding: 10px 12px; }
        .goods-item { display: flex; gap: 12px; padding: 12px; margin-bottom: 10px; background-color: #fff; border-radius: 8px; cursor: pointer; transition: box-shadow 0.2s; align-items: flex-start; }
        .goods-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .book-cover { width: 80px; height: 110px; border-radius: 4px; overflow: hidden; flex-shrink: 0; background-color: #f0f0f0; }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; }
        .book-info { flex: 1; min-width: 0; }
        .book-name { font-size: 15px; font-weight: bold; margin-bottom: 5px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .book-author { font-size: 13px; color: #666; margin-bottom: 4px; }
        .book-category { font-size: 12px; color: #0088ff; margin-bottom: 4px; display: inline-block; background-color: #e6f7ff; padding: 2px 6px; border-radius: 3px; }
        .book-condition { font-size: 12px; color: #ff6600; margin-bottom: 4px; }
        .book-status-tag { font-size: 11px; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-left: 4px; }
        .book-status-tag.sold { background-color: #ffeaea; color: #e74c3c; }
        .book-status-tag.delisted { background-color: #f0f0f0; color: #999; }
        .book-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .book-price { color: #ff4400; font-size: 18px; font-weight: bold; }
        .book-stock { font-size: 12px; color: #999; }
        .loading-tip { text-align:center; padding:20px; color:#999; }
        .empty-tip { text-align:center; padding:40px 20px; color:#999; }

        /* ========== 底部Tab栏 ========== */
        .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; background-color: #fff; border-top: 1px solid #eee; padding: 5px 0; z-index: 100; }
        .tab-bar .tab-item { flex: 1; text-align: center; cursor: pointer; }
        .tab-bar .tab-item .icon { font-size: 20px; margin-bottom: 3px; display: block; }
        .tab-bar .tab-item .text { font-size: 12px; color: #666; }
        .tab-bar .tab-item.active .text { color: #0088ff; }
        .container { padding-bottom: 60px; position: relative; }

        /* ========== Toast 提示 ========== */
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; z-index: 999; display: none; pointer-events: none; }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut { 0%{opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{opacity:0;} }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部搜索栏 -->
        <div class="header">
            <div class="user-avatar-btn" id="userAvatarBtn">
                <span id="avatarText">头</span>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索书名、作者、ISBN">
            <button class="filter-btn" id="filterToggleBtn" title="高级筛选">⚙</button>
            <div class="search-icon-wrap" id="searchBtn">
                <svg class="search-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path d="M909.6 854.5L649.9 594.8C690.2 542.7 712 479 712 412c0-80.2-31.3-155.4-87.9-212.1-56.6-56.7-132-87.9-212.1-87.9s-155.5 31.3-212.1 87.9C143.2 256.5 112 331.8 112 412c0 80.1 31.3 155.5 87.9 212.1C256.5 680.8 331.8 712 412 712c67 0 130.6-21.8 182.7-62l259.7 259.6a8.2 8.2 0 0 0 11.6 0l43.6-43.5a8.2 8.2 0 0 0 0-11.6zM570.4 570.4C528 612.7 471.8 636 412 636s-116-23.3-158.4-65.6C205.3 528 182 471.8 182 412s23.3-116.1 65.6-158.4C296 205.3 352.2 182 412 182s116.1 23.3 158.4 65.6S636 352.2 636 412s-23.2 116.1-65.6 158.4z" fill="#666"/>
                </svg>
            </div>
        </div>

        <!-- 高级筛选面板 -->
        <div class="filter-panel" id="filterPanel">
            <div class="filter-row">
                <span class="filter-label">售价区间:</span>
                <input type="number" class="filter-price-input" id="minPriceInput" placeholder="最低价" min="0" step="0.01">
                <span style="font-size:13px;color:#999;">—</span>
                <input type="number" class="filter-price-input" id="maxPriceInput" placeholder="最高价" min="0" step="0.01">
            </div>
            <div class="filter-row" style="margin-top:6px;">
                <span class="filter-label">交易状态:</span>
                <select class="filter-select" id="statusSelect">
                    <option value="">全部</option>
                    <option value="0">在售</option>
                    <option value="1">已售</option>
                    <option value="2">已下架</option>
                </select>
                <span class="filter-label" style="margin-left:8px;">卖家学号:</span>
                <input type="text" class="filter-input" id="sellerStudentIdInput" placeholder="输入卖家学号">
            </div>
            <div class="filter-row" style="margin-top:8px;">
                <div class="filter-actions">
                    <button class="btn-reset" id="resetFilterBtn">重置</button>
                    <button class="btn-apply" id="applyFilterBtn">应用筛选</button>
                </div>
            </div>
        </div>

        <!-- 搜索历史 -->
        <div class="search-history" id="searchHistory">
            <div class="history-header">
                <div class="history-title">搜索历史</div>
                <div class="clear-history" id="clearHistory">清空</div>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- 分类筛选栏 -->
        <div class="category" id="categoryBar">
            <div class="item active" data-category="">全部</div>
            <div class="item" data-category="文学小说">文学小说</div>
            <div class="item" data-category="科学技术">科学技术</div>
            <div class="item" data-category="人文社科">人文社科</div>
            <div class="item" data-category="经济管理">经济管理</div>
            <div class="item" data-category="教育考试">教育考试</div>
            <div class="item" data-category="其他">其他</div>
        </div>

        <!-- 图书列表 -->
        <div class="goods-list" id="goodsList">
            <div class="loading-tip" id="loadingTip">加载中...</div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar">
        <div class="tab-item active" data-page="goods">
            <span class="icon">📚</span>
            <span class="text">图书</span>
        </div>
        <div class="tab-item" data-page="publish">
            <span class="icon">📤</span>
            <span class="text">发布</span>
        </div>
        <div class="tab-item" data-page="mine">
            <span class="icon">👤</span>
            <span class="text">我的</span>
        </div>
    </div>

    <!-- 提示弹窗 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 核心状态变量 ==========
        const API_BASE = 'http://localhost:8080';
        let currentCategory = '';          // 当前选中分类（空=全部）
        let currentKeyword = '';           // 当前搜索关键词
        let currentMinPrice = '';          // 最低价
        let currentMaxPrice = '';          // 最高价
        let currentStatus = '';            // 状态：''=全部, '0'=在售, '1'=已售, '2'=已下架
        let currentSellerStudentId = '';   // 卖家学号
        const SEARCH_HISTORY_KEY = 'search_history_list';

        // ========== 工具函数 ==========
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('show');
            void t.offsetWidth;
            t.classList.add('show');
        }

        function getCurrentUser() {
            const raw = localStorage.getItem('currentUser');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch(e) { return null; }
        }

        // ========== 搜索历史 ==========
        function getSearchHistory() {
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }

        function saveSearchHistory(list) {
            // 去重 + 限制10条
            const unique = [];
            for (const item of list) {
                if (!unique.includes(item)) unique.push(item);
            }
            const trimmed = unique.slice(0, 10);
            localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(trimmed));
            return trimmed;
        }

        function addSearchHistory(keyword) {
            if (!keyword || !keyword.trim()) return;
            const kw = keyword.trim();
            const list = getSearchHistory();
            const filtered = list.filter(item => item !== kw);
            filtered.unshift(kw);
            saveSearchHistory(filtered);
            renderSearchHistory();
        }

        function clearSearchHistory() {
            localStorage.removeItem(SEARCH_HISTORY_KEY);
            renderSearchHistory();
        }

        function renderSearchHistory() {
            const list = getSearchHistory();
            const container = document.getElementById('historyList');
            if (list.length === 0) {
                container.innerHTML = '<span style="font-size:12px;color:#ccc;">暂无搜索历史</span>';
            } else {
                container.innerHTML = list.map(kw =>
                    `<span class="history-item" data-keyword="${kw}">${kw}</span>`
                ).join('');
            }
            // 绑定点击事件
            container.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', () => {
                    const kw = el.getAttribute('data-keyword');
                    document.getElementById('searchInput').value = kw;
                    currentKeyword = kw;
                    addSearchHistory(kw);
                    document.getElementById('searchHistory').classList.remove('show');
                    fetchBooks();
                });
            });
        }

        // ========== 构建搜索URL参数 ==========
        function buildSearchParams() {
            const params = new URLSearchParams();

            // 关键词搜索（匹配书名、作者、ISBN）
            if (currentKeyword.trim()) {
                params.append('keyword', currentKeyword.trim());
            }

            // 分类筛选
            if (currentCategory) {
                params.append('category', currentCategory);
            }

            // 价格区间
            if (currentMinPrice !== '') {
                params.append('minPrice', currentMinPrice);
            }
            if (currentMaxPrice !== '') {
                params.append('maxPrice', currentMaxPrice);
            }

            // 交易状态
            if (currentStatus !== '') {
                params.append('status', currentStatus);
            }

            // 卖家学号
            if (currentSellerStudentId.trim()) {
                params.append('sellerStudentId', currentSellerStudentId.trim());
            }

            return params.toString();
        }

        // ========== 获取图书列表（调用后端API） ==========
        async function fetchBooks() {
            const goodsList = document.getElementById('goodsList');
            const loadingTip = document.getElementById('loadingTip');

            // 显示加载中
            goodsList.innerHTML = '';
            loadingTip.style.display = 'block';
            goodsList.appendChild(loadingTip);

            try {
                const queryStr = buildSearchParams();
                const url = queryStr
                    ? `${API_BASE}/api/books/search?${queryStr}`
                    : `${API_BASE}/api/books/search`;

                console.log('[Goods] 请求搜索: ' + url);

                const response = await fetch(url);
                const result = await response.json();

                if (result.code === 200 && result.data) {
                    renderGoodsList(result.data);
                } else {
                    goodsList.innerHTML = '<div class="empty-tip">暂无图书数据</div>';
                }
            } catch (err) {
                console.error('[Goods] 获取图书失败:', err);
                goodsList.innerHTML = '<div class="empty-tip">网络错误，请确保服务器已启动<br><small>服务器地址: ' + API_BASE + '</small></div>';
            }
        }

        // ========== 渲染图书列表 ==========
        function renderGoodsList(books) {
            const goodsList = document.getElementById('goodsList');

            if (!books || books.length === 0) {
                goodsList.innerHTML = '<div class="empty-tip">📭 暂无符合条件的图书</div>';
                return;
            }

            goodsList.innerHTML = books.map(book => {
                const imgSrc = (book.images && book.images[0]) ? book.images[0] : 'https://picsum.photos/200/280?random=' + book.id;
                let statusTag = '';
                if (book.status === 1) {
                    statusTag = '<span class="book-status-tag sold">已售</span>';
                } else if (book.status === 2) {
                    statusTag = '<span class="book-status-tag delisted">已下架</span>';
                }

                return `
                <div class="goods-item" data-id="${book.id}">
                    <div class="book-cover">
                        <img src="${imgSrc}" alt="${book.name}" onerror="this.src='https://picsum.photos/200/280?random=${book.id}'">
                    </div>
                    <div class="book-info">
                        <div class="book-name">${book.name}${statusTag}</div>
                        <div class="book-author">${book.author || '未知作者'}</div>
                        <span class="book-category">${book.category || '其他'}</span>
                        <div class="book-condition">${book.condition || ''}</div>
                        <div class="book-price-row">
                            <span class="book-price">¥${(book.price || 0).toFixed(2)}</span>
                            <span class="book-stock">库存: ${book.stock || 0}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            // 绑定点击事件
            goodsList.querySelectorAll('.goods-item').forEach(item => {
                item.addEventListener('click', () => {
                    const bookId = item.getAttribute('data-id');
                    window.location.href = 'detail.html?id=' + bookId;
                });
            });
        }

        // ========== 初始化搜索与筛选 ==========
        function initSearchAndCategory() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const searchHistory = document.getElementById('searchHistory');
            const clearHistoryBtn = document.getElementById('clearHistory');
            const filterToggleBtn = document.getElementById('filterToggleBtn');
            const filterPanel = document.getElementById('filterPanel');
            const applyFilterBtn = document.getElementById('applyFilterBtn');
            const resetFilterBtn = document.getElementById('resetFilterBtn');
            const minPriceInput = document.getElementById('minPriceInput');
            const maxPriceInput = document.getElementById('maxPriceInput');
            const statusSelect = document.getElementById('statusSelect');
            const sellerStudentIdInput = document.getElementById('sellerStudentIdInput');

            // 搜索按钮
            searchBtn.addEventListener('click', () => {
                const kw = searchInput.value.trim();
                currentKeyword = kw;
                if (kw) addSearchHistory(kw);
                searchHistory.classList.remove('show');
                fetchBooks();
            });

            // 回车搜索
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const kw = searchInput.value.trim();
                    currentKeyword = kw;
                    if (kw) addSearchHistory(kw);
                    searchHistory.classList.remove('show');
                    fetchBooks();
                }
            });

            // 聚焦输入框显示历史
            searchInput.addEventListener('focus', () => {
                renderSearchHistory();
                searchHistory.classList.add('show');
            });

            // 点击外部隐藏历史
            document.addEventListener('click', (e) => {
                if (!searchHistory.contains(e.target) && e.target !== searchInput) {
                    searchHistory.classList.remove('show');
                }
            });

            // 清空历史
            clearHistoryBtn.addEventListener('click', clearSearchHistory);

            // 分类筛选
            document.querySelectorAll('#categoryBar .item').forEach(el => {
                el.addEventListener('click', () => {
                    document.querySelectorAll('#categoryBar .item').forEach(e => e.classList.remove('active'));
                    el.classList.add('active');
                    currentCategory = el.getAttribute('data-category');
                    fetchBooks();
                });
            });

            // 高级筛选切换
            filterToggleBtn.addEventListener('click', () => {
                filterPanel.classList.toggle('show');
                filterToggleBtn.classList.toggle('active');
            });

            // 应用筛选
            applyFilterBtn.addEventListener('click', () => {
                currentMinPrice = minPriceInput.value;
                currentMaxPrice = maxPriceInput.value;
                currentStatus = statusSelect.value;
                currentSellerStudentId = sellerStudentIdInput.value;
                fetchBooks();
            });

            // 重置筛选
            resetFilterBtn.addEventListener('click', () => {
                minPriceInput.value = '';
                maxPriceInput.value = '';
                statusSelect.value = '';
                sellerStudentIdInput.value = '';
                currentMinPrice = '';
                currentMaxPrice = '';
                currentStatus = '';
                currentSellerStudentId = '';
                fetchBooks();
            });

            // 渲染搜索历史
            renderSearchHistory();
        }

        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            initSearchAndCategory();

            // 加载当前用户信息
            const user = getCurrentUser();
            if (user) {
                const avatarText = document.getElementById('avatarText');
                if (avatarText && user.username) {
                    avatarText.textContent = user.username.charAt(0).toUpperCase();
                }
            }

            // 底部Tab栏
            document.querySelectorAll('.tab-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.getAttribute('data-page');
                    if (page === 'goods') {
                        // 已经在当前页
                        return;
                    } else if (page === 'publish') {
                        window.location.href = 'publish.html';
                    } else if (page === 'mine') {
                        window.location.href = 'mine.html';
                    }
                });
            });

            // 头像按钮跳转个人中心
            const avatarBtn = document.getElementById('userAvatarBtn');
            if (avatarBtn) {
                avatarBtn.addEventListener('click', () => {
                    window.location.href = 'mine.html';
                });
            }

            // 首次加载数据
            fetchBooks();
        });
    </script>
</body>
</html>
